services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartaquapark-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=smart_aquapark;Username=postgres;Password=postgres
      Jwt__Key: THIS_IS_A_SUPER_SECRET_KEY_FOR_SMART_AQUAPARK_API_123456789
      Jwt__Issuer: SmartAquaparkApi
      Jwt__Audience: SmartAquaparkClient
      Jwt__ExpirationMinutes: 60
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: smartaquapark-db
    restart: always
    environment:
      POSTGRES_DB: smart_aquapark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - smartaquapark-db-data:/var/lib/postgresql/data

volumes:
  smartaquapark-db-data: