name: CI and container delivery

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and audit direct and transitive dependencies
        run: dotnet restore SmartAquapark.Api.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -warnaserror:NU1900,NU1903,NU1904
      - name: Build
        run: dotnet build SmartAquapark.Api.slnx -c Release --no-restore
      - name: Test
        run: dotnet test SmartAquapark.Api.slnx -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  container:
    name: Build, scan and smoke-test container
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      API_IMAGE: smartaquapark-api:ci
      COMPOSE_PROJECT_NAME: smartaquapark-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked source for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          format: json
          output: source-secrets.json
      - name: Generate isolated development credentials
        run: python3 scripts/create-dev-env.py
      - name: Validate Compose and build runtime image
        run: |
          docker compose config --quiet
          docker compose build --pull api
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: smartaquapark-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: image-vulnerabilities.json
          skip-setup-trivy: true
      - name: Start API and PostgreSQL and wait for readiness
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Verify database-backed authentication and health endpoints
        run: python3 scripts/smoke-test.py
      - name: Save the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save smartaquapark-api:ci -o container-image.tar
      - name: Upload the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-image
          path: container-image.tar
          retention-days: 1
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose ps --all > diagnostics/compose-status.txt
          docker compose logs --no-color > diagnostics/compose.log 2>&1
      - name: Upload scan reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-reports
          path: |
            source-secrets.json
            image-vulnerabilities.json
            diagnostics/
          retention-days: 7
      - name: Clean up isolated CI containers and database
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish tested image to GHCR
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
      - name: Load tested image and determine lowercase registry path
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          docker load -i container-image.tar
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish the exact image that passed scanning and tests
        run: |
          docker tag smartaquapark-api:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag smartaquapark-api:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
